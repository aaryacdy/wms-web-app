#url
#spring.datasource.url=jdbc:postgresql://192.168.1.66:5432/db-wms?useUnicode=true;characterEncoding=UTF-8
spring.datasource.url=jdbc:postgresql://localhost:5432/db-wms?useUnicode=true;characterEncoding=UTF-8

#username
spring.datasource.username=postgres
spring.datasource.password=aarya
#spring.datasource.password=toor

# Enable JSP support
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# swagger-ui custom path
#springdoc.swagger-ui.enabled=true
#springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.api-docs.enabled=true
#springdoc.swagger-ui.display-request-duration=true
#springdoc.api-docs.path=/api-docs

server.port=8080
logging.level.root=ERROR
logging.level.com.kathford=TRACE
# ===============================
# = DATA SOURCE
# ==============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=wms
spring.datasource.hikari.connection-test-query=Select 1
spring.datasource.hikari.maximum-pool-size=20
# ===============================
#Configure  JPA / HIBERNATE To Create Auto Table
# ===============================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#PostgreSQLDialect
# ===============================
# = Custom context path
# ===============================
server.servlet.contextPath=/wms
# ===============================
# = Jackson serialization
# ===============================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
# ==============================
# = Naming convention in table column
# ==============================
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# ===============================
# = ignoring from creating hibernate sequence table
# ===============================
#spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.devtools.restart.additional-exclude=logs/**
# ===============================
#security.basic.enabled=false

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

